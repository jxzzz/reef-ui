name: Release

# Trusted Publishing（OIDC）：npm 信任"本仓库本 workflow"发起的发布，
# 不需要 npm token，也不需要 2FA OTP。需在 npmjs.com 上为每个包
# 配置 Trusted Publisher（jxzzz/reef-ui + 本文件名 release.yml）。
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC 关键权限
  contents: write # 推送 changeset publish 创建的版本 tag

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4 # 从 packageManager 字段读取 pnpm 版本

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # npm >= 11.5.1 是 Trusted Publishing 的最低要求
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish
        run: pnpm exec changeset publish

      - name: Push tags # changeset publish 只在 runner 本地打 tag；
        # `git push --tags` 在 shallow checkout 下连续三次静默失效（报 up-to-date 但远端无 tag），
        # 改为按名显式推送 HEAD 上的 tag，推不上去会直接报错
        run: git tag --points-at HEAD | xargs -r git push origin
